<!DOCTYPE html
  PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black" />
<meta name="format-detection" content="telephone=no" />

<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <title>{title}</title>
  <link rel="stylesheet" type="text/css" href="{sitepath}plugins/template/css/error.css" />
</head>

<body>
  <div class="bg">
    <div class="error_body">
      <div class="error_left" style=" background-image: url({sitepath}plugins/template/images/{img}.png);"> </div>
      <div class="error_right">
        <h1>{code}</h1>
        <h2>{title} </h2>
        <h3>{info} </h3>
        <span id="time"></span>
        <p>{desc}</p>
        <div class="btn-area">
           <a class="btn btn1" href="{url}" {click} class="button">{btn}</a>
           <a class="btn btn2" href="javascript:history.back();">返　回</a>
        </div>
       </div>
    </div>
  </div>
  {js}
</body>

</html>
