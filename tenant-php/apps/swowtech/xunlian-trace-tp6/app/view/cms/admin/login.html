<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>登录成功</title>
</head>
<body>
<script>
    var oauth = '';
    localStorage.setItem('token', '{$data.token}');
    localStorage.setItem('admin_name', 'admin');
    {foreach $data['oauth'] as $key=>$vo }
    oauth += '{$vo},';
    {/foreach}
    localStorage.setItem('oauth', oauth);
    window.location.href = "/front/";
</script>
</body>
</html>
